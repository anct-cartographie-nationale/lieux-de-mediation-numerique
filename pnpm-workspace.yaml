allowBuilds:
  # @swc/core livre ses binaires natifs en dépendances optionnelles : son script de build est inutile.
  '@swc/core': false
  esbuild: true

# Une version publiée depuis moins de dix jours ne s'installe pas — le garde-fou de chaîne
# d'approvisionnement que mednum-cli porte déjà.
#
# La bibliothèque en a besoin au moins autant : elle est **en amont**, et mednum-cli l'exclut
# nommément de son propre délai pour pouvoir consommer une publication fraîche. Sans cette
# ligne, le seul trou de sa garde passerait exactement par ici.
minimumReleaseAge: 14400
